<html lang="id">
<head>

<style>

:root[data-theme="dark"]{--bg:#1a1040;--dot:#271a5c;--sf:#2b1c66;--ink:#fff;--mut:#cfc6f5;--bd:#ffe14d;--sh:#000;--ok:#0f7a55;--mid:#7a6410;--bad:#8a2a55;--fld:#1a1040}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 2.5px,transparent 2.5px);background-size:24px 24px;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
h1,h2,h3,.disp{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-weight:700;line-height:1.2;margin:0}
.wrap{max-width:680px;margin:0 auto;padding:16px}
.hud{position:sticky;top:env(safe-area-inset-top,0px);padding:8px 0 14px;z-index:5;background:linear-gradient(var(--bg) 80%,transparent)}
.path{display:flex;align-items:center}
.node{flex:0 0 auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--sf);border:3px solid var(--bd);font-size:21px;box-shadow:3px 3px 0 var(--sh);transform:rotate(-4deg)}

.node.done{background:var(--grn)}
.seg{flex:1;height:0;border-top:4px dashed var(--bd)}.seg.done{border-top-style:solid;border-color:var(--grn)}
.stats{display:flex;justify-content:space-between;margin-top:12px;font:700 16px "Fredoka",system-ui,sans-serif}
.chip{background:var(--sf);border:3px solid var(--bd);border-radius:999px;padding:3px 14px;box-shadow:3px 3px 0 var(--sh)}
.xp{color:var(--blue)}.combo{color:var(--pink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .xp{color:#8fb3ff}:root:not([data-theme="light"]) .combo{color:#ff8ab6}}
.card{background:var(--sf);border:4px solid var(--bd);border-radius:24px;padding:22px;margin-top:6px;box-shadow:8px 8px 0 var(--sh)}

.q{font-size:22px;margin:10px 0 16px}
.mas{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.mi{font-size:46px;line-height:1;flex:0 0 auto;display:inline-block}

.bub{position:relative;background:var(--yel);color:#111;border:3px solid var(--bd);border-radius:16px;padding:8px 14px;font-weight:700}

.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:var(--fld);border:3px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:12px;cursor:pointer;box-shadow:4px 4px 0 var(--sh);transition:transform .1s,box-shadow .1s}
.opt:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--sh)}
.opt:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)}
.ltr{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font:700 18px "Fredoka",system-ui,sans-serif;border:3px solid var(--bd);background:var(--blue)}
.opt:nth-child(2) .ltr{background:var(--pink)}.opt:nth-child(3) .ltr{background:#0a9c6e}.opt:nth-child(4) .ltr{background:var(--vio)}

.opt:disabled{cursor:default}
.opt.p3{background:var(--ok);animation:hop .45s}.opt.p2{background:var(--mid)}.opt.p1,.opt.p0{background:var(--bad);animation:wig .45s}

.fb{border:3px solid var(--bd);border-radius:16px;padding:14px 16px;margin:8px 0 16px;animation:pop .25s ease-out}

.fb b{font-family:"Fredoka",system-ui,sans-serif;font-size:19px}
.btn{font:700 18px "Fredoka",system-ui,sans-serif;background:var(--blue);color:#fff;border:3px solid var(--bd);border-radius:16px;padding:12px 24px;cursor:pointer;box-shadow:5px 5px 0 var(--sh);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--sh)}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--sh)}
.btn.alt{background:var(--yel);color:#111}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:3px solid var(--bd);background:var(--fld);color:var(--ink);margin:6px 0 16px}
label.l{font-weight:700;font-size:15px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:3px solid var(--bd);border-radius:16px;margin-bottom:12px;cursor:pointer;background:var(--fld);box-shadow:4px 4px 0 var(--sh)}

.chk.on{background:var(--ok)}
.stars{font-size:40px;letter-spacing:4px}
.hero{font-size:54px;display:flex;gap:10px;margin-bottom:6px}
.hero span{animation:bob 1.4s ease-in-out infinite}.hero span:nth-child(2){animation-delay:.2s}.hero span:nth-child(3){animation-delay:.4s}
h1{font-size:34px;text-shadow:3px 3px 0 var(--pink)}
.big{font-size:70px;display:inline-block;animation:bob 1.2s ease-in-out infinite}
.bar{height:20px;background:var(--fld);border-radius:99px;overflow:hidden;border:3px solid var(--bd)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--grn) 0 10px,#0fa877 10px 20px);transition:width .9s}
.row{margin:14px 0}.row .t{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px;gap:8px}
.verdict{border:3px solid var(--bd);border-radius:18px;padding:16px;margin:14px 0;box-shadow:4px 4px 0 var(--sh)}
.mut{color:var(--mut)}
.mis{border:3px dashed var(--bd);border-radius:16px;padding:12px 14px;margin:14px 0;background:var(--fld)}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.snd{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:16px;border:3px solid var(--bd);background:var(--yel);font-size:24px;cursor:pointer;box-shadow:4px 4px 0 var(--sh);z-index:20}
.snd:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)}
.cf{position:fixed;top:-20px;width:10px;height:16px;border-radius:2px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes hop{0%{transform:scale(1)}40%{transform:scale(1.06) translateY(-6px)}100%{transform:scale(1)}}
@keyframes wig{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const L=[
{n:"Temukan Masalah",e:"🔍",tip:"Data 15 temanmu yang punya skill kreatif: apakah pernah dapat klien berbayar, berapa kali, dan apa kendalanya. Lalu tulis masalahnya dalam satu kalimat: siapa yang terdampak, apa yang terjadi, dan berapa banyak.",
q:[
{t:"Banyak temanmu jago desain dan edit video, tapi hampir tidak ada yang pernah dapat klien. Langkah pertama untuk memastikan ini masalah nyata?",o:[
["Langsung membuat website marketplace jasa siswa SMK.",0,"Itu melompat ke solusi. Pastikan dulu masalahnya nyata dan sering terjadi."],
["Mendata 15 temanmu yang punya skill: sudah pernah menawarkan jasa atau belum, dapat berapa klien, dan apa kendalanya.",3,"Tepat. Data dari kondisi nyata lebih kuat daripada perasaan."],

["Perusahaan besar supaya bayarannya besar.",1,"Sulit dijangkau dan belum tentu mau memakai jasa siswa pemula."],
["UMKM yang pemiliknya berusia di bawah 40 tahun.",2,"Lebih sempit, tapi usia tidak menunjukkan siapa yang benar-benar butuh konten."]]},

["Semua pengikut akun sekolah lewat polling story.",0,"Banyak jawaban tanpa seleksi menghasilkan data yang bising."],

{n:"Validasi Masalah",e:"🧪",tip:"Tulis ulang pertanyaan wawancaramu menjadi pertanyaan cerita masa lalu. Wawancarai 15 pemilik UMKM, tandai jawaban berisi tindakan nyata (menyewa admin, membayar desain, mencoba sendiri), dan abaikan pujian.",
q:[
{t:"Pertanyaan wawancara mana yang paling kuat untuk pemilik UMKM?",o:[

["Ceritakan terakhir kali kamu butuh konten untuk promosi. Apa yang kamu lakukan dan berapa biayanya?",3,"Tepat. Cerita masa lalu mengungkap perilaku asli."],

["Seberapa sering kamu posting di media sosial dalam seminggu?",2,"Berguna untuk data kebiasaan, tapi belum menggali masalah dan cara mengatasinya."]]},
{t:"Dari 12 pemilik UMKM, 10 bilang 'konten itu penting, aku kewalahan'. Tapi hanya 2 yang pernah mengeluarkan uang untuk membuatnya. Kesimpulanmu?",o:[
["10 dari 12 setuju, masalah tervalidasi!",0,"Keluhan itu murah. Yang penting adalah uang dan usaha yang benar-benar keluar."],
["Keluhan banyak tapi yang mengeluarkan uang sedikit. Gali siapa 2 orang itu dan kenapa mereka mau membayar.",3,"Tepat. Kamu membaca perilaku, bukan kata-kata."],
["Tambah wawancara sampai angkanya bagus.",1,"Itu bias konfirmasi, mencari data yang menyenangkan."],
["Abaikan 2 orang itu, 10 lainnya sudah cukup.",0,"Justru 2 orang yang membayar itu sinyal paling berharga untuk digali."]]},

["Hargai, tapi catat sebagai opini. Cari bukti dari calon pelanggan yang mau bertindak.",3,"Tepat. Kamu memisahkan semangat dari bukti."],
["Abaikan dia sepenuhnya.",1,"Terlalu keras. Hargai dukungannya, tapi jangan jadikan data."],
["Ajak dia jadi kreator pertama dan lihat apakah dia benar-benar mengerjakan.",2,"Cara bagus menguji komitmen, tapi tetap cari bukti dari pelanggan sebenarnya, bukan hanya temanmu."]]}]},
{n:"Validasi Solusi",e:"🛠️",tip:"Tawarkan paket konten manual lewat WhatsApp selama 2 minggu dan kerjakan dengan tim kecil siswa. Targetkan minimal 3 UMKM yang benar-benar membayar, lalu catat alasan yang tidak jadi memesan.",
q:[
{t:"Sebelum membuat platform, apa cara termurah menguji solusi jasa konten siswa?",o:[
["Membangun website marketplace lengkap dulu supaya meyakinkan.",0,"Mahal dan berisiko. Kamu belum tahu ada yang mau."],

["Survei 100 UMKM tentang fitur platform yang diinginkan.",1,"Orang pandai menyebut fitur, tapi daftar keinginan tidak sama dengan kebutuhan."]]},
{t:"Penawaran paket dibuka: 30 UMKM bilang tertarik, tapi hanya 5 yang membayar. Cara membacanya?",o:[
["30 yang tertarik membuktikan minat besar.",0,"Tertarik itu gratis. Pembayaran adalah sinyal sebenarnya."],
["5 pembayar adalah sinyal nyata. Tanyakan alasan 5 pembayar dan 25 lainnya, lalu perbaiki.",3,"Tepat. Fokus pada komitmen dan belajar dari penolakan."],
["Gagal, ganti ide.",1,"Terlalu cepat menyerah. Lima pembayar adalah titik awal belajar."],
["Turunkan harga sampai semua yang tertarik mau membayar.",1,"Diskon menutupi sinyal. Cari tahu dulu apa yang membuat mereka enggan."]]},

["Langsung membuat platform canggih untuk mengotomatisasi semuanya.",0,"Terlalu dini. Otomatisasi sebelum pola terbukti membuang tenaga."],
["Mencatat bagian yang paling merepotkan dan yang paling dihargai klien, lalu memilih 3 fitur inti untuk prototype.",3,"Tepat. Prototype lahir dari pola nyata, bukan tebakan."],
["Menghentikan layanan sampai sistemnya siap.",1,"Kamu kehilangan momentum dan pembelajaran dari pelanggan."],
["Minta teman yang jago coding membuat platformnya supaya cepat selesai.",1,"Cepat, tapi kamu membangun sebelum tahu fitur mana yang benar-benar dibutuhkan."]]}]}
];
const GM=[
"Wawancarai sampai 15 calon pengguna yang sesuai segmen, dan tetapkan target jumlah wawancara per minggu.",
"Tulis masalahmu dalam satu kalimat: siapa yang terdampak, apa yang terjadi, dan berapa waktu atau uang yang terbuang.",

"Rekap semua wawancara dalam satu tabel, lalu tandai pola keluhan yang muncul di minimal 5 orang.",
"Jalankan uji manual atau landing page selama 1 minggu sebelum membangun produk sungguhan.",
"Pilih 3 fitur inti dengan menandai keluhan paling sering dan bagian yang paling dihargai pelanggan."];
const G=[
"Sudah mewawancarai minimal 15 calon pengguna yang sesuai segmen.",
"Bisa menyebut masalah dalam satu kalimat lengkap dengan kerugian yang terukur.",
"Minimal 3 orang menunjukkan komitmen nyata (bayar, pre-order, atau surat minat).",
"Pola keluhan yang sama muncul di minimal 5 wawancara.",
"Sudah menguji solusi versi manual atau landing page tanpa membangun produk penuh.",

const st={lv:0,qi:0,xp:0,combo:0,best:0,sc:[0,0,0,0],gate:[],idea:"",done:false,ans:false};
const $=s=>document.querySelector(s),M=$("#main");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function hud(){
 let h='<div class="path">';
 for(let i=0;i<5;i++){h+=`<div class="node ${i<st.lv?'done':''} ${i===st.lv&&!st.done?'on':''}" title="${i<4?L[i].n:'Gerbang Prototype'}">${i<4?L[i].e:'🚀'}</div>`;if(i<4)h+=`<div class="seg ${i<st.lv?'done':''}"></div>`}
 h+=`</div><div class="stats"><span class="chip xp">⭐ ${st.xp} XP</span><span class="chip combo">🔥 Kombo x${st.combo}</span></div>`;
 $("#hud").innerHTML=h;
}
function intro(){
 hud();
 M.innerHTML=`<div class="card"><div class="hero">🚀<span>💡</span><span>🧪</span><span>⭐</span></div><h1>Founder Quest</h1>
 <p class="disp" style="font-size:19px;color:var(--lag);margin:6px 0 12px">Dari masalah sampai siap prototype</p>
 <div class="mis" style="margin-top:0"><b>📍 Studi kasus:</b> Kamu siswa SMK. Banyak temanmu jago desain dan edit video, tapi hampir tidak ada yang pernah dapat klien. Di sisi lain, warung, kafe, dan toko di sekitar sekolah butuh konten TikTok dan Instagram tapi bingung mencari siapa yang mengerjakan. Dari celah inilah perjalananmu sebagai founder dimulai, dari menemukan masalah sampai membuktikan solusinya layak dibuatkan prototype.</div><p>Ada 4 level dengan 3 situasi di tiap level, lalu 1 gerbang akhir. Pilih langkah yang paling tepat. Jawaban terbaik memberi XP penuh, dan jawaban tepat berturut-turut membuka kombo.</p>
 <p class="mut">Waktu bermain sekitar 12 menit. Setiap pilihan datang dengan penjelasan.<br>🎵 Ada musik latar. Tombol suara ada di pojok kanan bawah.</p>
 <button class="btn" id="go">Mulai Ekspedisi</button></div>`;
 $("#go").onclick=()=>{BGM.start();lvIntro()};
}
function lvIntro(){
 hud();const l=L[st.lv];
 M.innerHTML=`<div class="card" style="text-align:center"><div class="big">${l.e}</div><div class="lv">LEVEL ${st.lv+1} DARI 5</div><h2 style="font-size:28px">${l.n}</h2>
 <p class="mut">${["Kasusmu: skill siswa SMK yang belum menghasilkan uang.","Siapa klien yang paling butuh dan mau membayar?","Saatnya membuktikan masalah ini benar-benar menyakitkan bagi UMKM.","Uji paket konten manual sebelum membangun platform apa pun."][st.lv]}</p>
 <button class="btn" id="go">Masuk Level</button></div>`;
 $("#go").onclick=()=>{st.qi=0;ques()};
}
function ques(){
 hud();st.ans=false;const l=L[st.lv],q=l.q[st.qi];
 M.innerHTML=`<div class="card"><div class="lv">${l.e} ${l.n} · Situasi ${st.qi+1} dari 3</div><div class="mas"><span class="mi" id="mi">🤖</span><span class="bub" id="mb">Pilih langkah terbaik ya!</span></div><h2 class="q">${esc(q.t)}</h2><div id="opts"></div><div id="fb"></div></div>`;
 const box=$("#opts");
 shuf(q.o).forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`<span class="ltr">${"ABCD"[i]}</span><span>${esc(o[0])}</span>`;b.onclick=()=>pick(b,o,q);box.appendChild(b)});
}
function pick(b,o,q){
 if(st.ans)return;st.ans=true;const p=o[1];
 document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x!==b)x.classList.add("dim")});
 b.classList.add("p"+p);mood(p);
 const best=q.o.find(x=>x[1]===3);
 let gain=p*10;
 if(p>=2){st.combo++;if(st.combo>=2)gain+=st.combo*2}else st.combo=0;
 st.best=Math.max(st.best,st.combo);st.xp+=gain;st.sc[st.lv]+=p;hud();
 const head=p===3?"Luar biasa! +"+gain+" XP":p===2?"Cukup baik. +"+gain+" XP":p===1?"Kurang tepat. +"+gain+" XP":"Jebakan! +0 XP";
 const last=st.qi===2;
 $("#fb").innerHTML=`<div class="fb p${p}"><b>${head}</b><p style="margin:6px 0 0">${esc(o[2])}</p>${p<3?`<p style="margin:8px 0 0"><b style="font-size:15px">Langkah terbaik:</b> ${esc(best[0])}</p>`:""}</div><button class="btn" id="nx">${last?"Selesaikan Level":"Lanjut"}</button>`;
 $("#nx").onclick=()=>last?lvDone():(st.qi++,ques());
 $("#nx").focus();
}
function lvDone(){
 const s=st.sc[st.lv],stars=s>=8?3:s>=5?2:1,l=L[st.lv];
 M.innerHTML=`<div class="card" style="text-align:center"><div class="lv">LEVEL ${st.lv+1} SELESAI</div><h2 style="font-size:28px">${l.n}</h2>
 <div class="stars" aria-label="${stars} dari 3 bintang">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
 <p class="mut">Skor level: ${s} dari 9. ${stars===3?"Sempurna, kamu berpikir seperti founder yang berbasis bukti.":stars===2?"Bagus, tinggal sedikit lagi.":"Level ini perlu latihan, nanti ada saran di hasil akhir."}</p>
 <button class="btn" id="go">${st.lv<3?"Ke Level Berikutnya":"Menuju Gerbang Prototype"}</button></div>`;
 if(stars>=2)confetti(45);$("#go").onclick=()=>{st.lv++;st.lv<4?lvIntro():gate()};
}
function gate(){
 hud();
 M.innerHTML=`<div class="card"><div class="lv">🚀 LEVEL 5 · GERBANG PROTOTYPE</div><h2 class="q">Pertarungan terakhir: tunjukkan buktinya</h2>
 <p class="mut">Ini bagian yang jujur. Bayangkan kamu menjalankan proyek jasa konten siswa tadi di sekolahmu, atau pakai ide bisnismu sendiri kalau sudah punya. Centang hanya yang benar-benar sudah dikerjakan. Gerbang hanya terbuka untuk bukti.</p>
 <div id="gl"></div><button class="btn" id="go">Buka Gerbang</button></div>`;
 const gl=$("#gl");
 G.forEach((t,i)=>{const lb=document.createElement("label");lb.className="chk";lb.innerHTML=`<input type="checkbox"><span>${esc(t)}</span>`;
 lb.querySelector("input").onchange=e=>{lb.classList.toggle("on",e.target.checked);st.gate[i]=e.target.checked};gl.appendChild(lb)});
 $("#go").onclick=()=>{const n=G.filter((_,i)=>st.gate[i]).length;st.xp+=n*15;st.lv=4;st.done=true;hud();result(n)};
}
function result(g){
 const tot=st.sc.reduce((a,b)=>a+b,0),pts=tot+g*2,pct=Math.round(pts/48*100);
 const pcts=st.sc.map(s=>Math.round(s/9*100)).concat([Math.round(g/6*100)]);
 const names=L.map(l=>l.n).concat(["Gerbang Prototype"]);
 let v,cls,msg;
 if(pct>=80&&g>=4){v="🚀 Layak Dibuatkan Prototype";cls="ok";msg="Cara berpikir dan buktimu sudah kuat. Saatnya mengubah temuan menjadi prototype sederhana."}
 else if(pct>=80){v="🟡 Teori Kuat, Bukti Belum Cukup";cls="mid";msg="Pemahamanmu bagus, tapi tahu caranya tidak sama dengan punya bukti. Kumpulkan bukti nyata dulu sebelum membangun."}
 else if(pct>=55&&g>=3){v="🟡 Hampir Siap, Perlu Validasi Tambahan";cls="mid";msg="Fondasimu cukup baik tapi buktinya belum mengunci. Tutup celah di bawah ini sebelum membangun apa pun."}
 else{v="🔴 Belum Layak, Kembali ke Lapangan";cls="bad";msg="Membangun prototype sekarang berisiko membuang waktu dan uang. Perkuat dulu bukti di area terlemah, lalu mainkan ulang."}
 const T=[[0,"Calon Founder Pemula","🌱","Kamu baru melangkah, dan semua founder hebat pernah di titik ini."],[150,"Pengamat Cermat","🔭","Kamu mulai peka melihat masalah, tinggal diasah dengan bukti."],[270,"Detektif Pelanggan","🕵️","Kamu sudah paham cara menggali kebutuhan pelanggan."],[390,"Penguji Handal","🧪","Kamu terbiasa menguji asumsi, bukan sekadar percaya."],[480,"Founder Muda Berbukti","🏅","Keputusanmu didukung bukti. Ini level founder yang siap dipercaya."],[560,"Legenda Startup Sekolah","👑","Nyaris sempurna. Kamu berpikir dan bertindak seperti founder berpengalaman."]];
 let ti=0;T.forEach((t,i)=>{if(st.xp>=t[0])ti=i});const tt=T[ti],nx=T[ti+1];
 const lp=pcts.slice(0,4),wl=lp.indexOf(Math.min(...lp)),bi=pcts.indexOf(Math.max(...pcts));
 const ms=[];
 if(cls==="ok"){ms.push("Tetapkan 3 fitur inti prototype dari keluhan paling sering dan bagian yang paling dihargai pelanggan.","Tentukan satu metrik sukses yang jelas, misalnya 10 paket konten terjual per bulan.","Bangun prototype sederhana dalam 2 sampai 4 minggu, uji ke minimal 5 pengguna, dan catat apa yang mereka lakukan, bukan apa yang mereka katakan.")}
 else{if(lp[wl]<80)ms.push("<b>"+names[wl]+":</b> "+L[wl].tip);G.forEach((_,i)=>{if(!st.gate[i]&&ms.length<3)ms.push("<b>Bukti:</b> "+GM[i])})}
 const mt=cls==="ok"?"Misi berikutnya: bangun prototype":cls==="mid"?"Misi penutup celah":"Misi kembali ke lapangan";
 const rows=names.map((n,i)=>`<div class="row"><div class="t"><span>${i<4?L[i].e:"🚀"} ${n}</span><span>${pcts[i]}%</span></div><div class="bar"><i style="width:0" data-w="${pcts[i]}%"></i></div></div>`).join("");
 M.innerHTML=`<div class="card"><div class="lv">HASIL EKSPEDISI${st.idea?" · "+esc(st.idea):""}</div>
 <div class="big" style="font-size:60px">${tt[2]}</div>
 <h2 style="font-size:28px">${tt[1]}</h2>
 <p style="margin:6px 0">${tt[3]}</p>
 <p class="mut">Peringkat ${ti+1} dari 6 · ${st.xp} XP${nx?" · "+(nx[0]-st.xp)+" XP lagi menuju "+nx[1]:" · Peringkat tertinggi!"}<br>Skor kesiapan ${pct}% · Kombo terbaik x${st.best} · Bukti gerbang ${g} dari 6 · Kekuatan utama: ${names[bi]}</p>
 <div class="verdict" style="background:var(--${cls==="ok"?"ok":cls==="mid"?"mid":"bad"})"><h3 style="font-size:21px;margin-bottom:6px">${v}</h3><p style="margin:0">${msg}</p></div>
 ${rows}
 <div class="mis"><h3 style="font-size:19px;margin-bottom:8px">🎯 ${mt}</h3><ol style="margin:0;padding-left:20px">${ms.map(m=>`<li style="margin-bottom:8px">${m}</li>`).join("")}</ol></div>
 <p class="mut" style="font-size:14px">Catatan: asesmen ini mengukur cara berpikir dan bukti yang kamu laporkan sendiri. Hasilnya panduan refleksi, bukan jaminan keberhasilan bisnis.</p>
 <div class="acts"><button class="btn" id="re">Main Lagi</button><button class="btn alt" id="cp">Salin Ringkasan</button></div><p id="cm" class="mut" style="font-size:14px"></p></div>`;
 if(cls==="ok"||ti>=4)confetti(100);requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll(".bar i").forEach(i=>i.style.width=i.dataset.w),60));
 $("#re").onclick=()=>{Object.assign(st,{lv:0,qi:0,xp:0,combo:0,best:0,sc:[0,0,0,0],gate:[],done:false,ans:false});intro()};
 $("#cp").onclick=()=>{
  const txt=`Founder Quest${st.idea?" ("+st.idea+")":""}\nGelar: ${tt[1]} (${st.xp} XP)\nSkor kesiapan: ${pct}%\nVerdict: ${v.replace(/^\S+\s/,"")}\n`+names.map((n,i)=>`- ${n}: ${pcts[i]}%`).join("\n");
  const ok=()=>$("#cm").textContent="Ringkasan tersalin.",no=()=>$("#cm").textContent="Gagal menyalin, silakan salin manual.";
  try{navigator.clipboard.writeText(txt).then(ok,no)}catch(e){no()}};
}
const MD={3:["🤩","Mantap! Itu insting founder sejati!"],2:["😎","Lumayan! Dikit lagi sempurna."],1:["🤔","Hmm, masih ada yang lebih tajam nih."],0:["😵","Awas jebakan! Tenang, ini buat belajar."]};
function mood(p){const i=$("#mi"),b=$("#mb");if(!i)return;BGM.sfx(p);i.textContent=MD[p][0];b.textContent=MD[p][1];i.className="mi "+(p>=2?"hop":"wig");if(p===3)confetti(28)}
function confetti(n){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const c=["#ff4d8d","#ffe14d","#12c48b","#2d6cff","#8a4dff"];for(let i=0;i<n;i++){const e=document.createElement("i");e.className="cf";e.style.cssText=`left:${Math.random()*100}vw;background:${c[i%5]};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.4}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),3800)}}
const BGM={ctx:null,on:true,t:0,step:0,timer:null,
M:[[72,76,79,76,72,76,79,84],[69,72,76,72,69,72,76,81],[72,77,81,77,72,77,81,84],[71,74,79,74,71,74,79,83]],B:[48,45,41,43],
hz:m=>440*Math.pow(2,(m-69)/12),
start(){if(!this.on)return;if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();this.g=this.ctx.createGain();this.g.gain.value=.07;this.g.connect(this.ctx.destination)}
 if(this.ctx.state==="suspended")this.ctx.resume();if(!this.timer){this.t=this.ctx.currentTime+.05;this.timer=setInterval(()=>this.sched(),100)}},
stop(){clearInterval(this.timer);this.timer=null;if(this.ctx)this.ctx.suspend()},
note(m,t,d,ty,v){const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=ty;o.frequency.value=this.hz(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(this.g);o.start(t);o.stop(t+d+.05)},
sched(){const sp=60/132/2;while(this.t<this.ctx.currentTime+.3){const bar=Math.floor(this.step/8)%4,i=this.step%8;this.note(this.M[bar][i],this.t,sp*.9,"square",.5);if(i%4===0)this.note(this.B[bar],this.t,sp*3.2,"triangle",1.3);if(i%2===1)this.note(this.M[bar][i]-12,this.t,sp*.4,"triangle",.35);this.t+=sp;this.step++}},
sfx(p){if(!this.on||!this.ctx||this.ctx.state!=="running")return;const t=this.ctx.currentTime+.02;
 if(p===3){this.note(79,t,.12,"square",1.2);this.note(84,t+.1,.12,"square",1.2);this.note(91,t+.2,.25,"square",1.2)}
 else if(p===2)this.note(76,t,.2,"square",1.1);
 else{this.note(55,t,.15,"sawtooth",1);this.note(50,t+.14,.25,"sawtooth",1)}}};
(function(){const b=document.createElement("button");b.id="snd";b.className="snd";b.setAttribute("aria-label","Nyalakan atau matikan musik");b.textContent="🔊";document.body.appendChild(b);
 b.onclick=()=>{BGM.on=!BGM.on;b.textContent=BGM.on?"🔊":"🔇";BGM.on?BGM.start():BGM.stop()};
 document.addEventListener("visibilitychange",()=>{if(!BGM.ctx)return;document.hidden?BGM.ctx.suspend():BGM.on&&BGM.ctx.resume()})})();
intro();
</script>
</body>
