<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Founder Quest: Dari Masalah ke Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffd93d;--dot:#f2c200;--sf:#fff;--ink:#111;--mut:#44474f;--bd:#111;--sh:#111;--pink:#ff4d8d;--blue:#2d6cff;--grn:#12c48b;--vio:#8a4dff;--yel:#ffe14d;--ok:#b8f5d9;--mid:#fff0a0;--bad:#ffc2d9;--fld:#fff7d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1040;--dot:#271a5c;--sf:#2b1c66;--ink:#fff;--mut:#cfc6f5;--bd:#ffe14d;--sh:#000;--ok:#0f7a55;--mid:#7a6410;--bad:#8a2a55;--fld:#1a1040}}
:root[data-theme="dark"]{--bg:#1a1040;--dot:#271a5c;--sf:#2b1c66;--ink:#fff;--mut:#cfc6f5;--bd:#ffe14d;--sh:#000;--ok:#0f7a55;--mid:#7a6410;--bad:#8a2a55;--fld:#1a1040}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 2.5px,transparent 2.5px);background-size:24px 24px;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
h1,h2,h3,.disp{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-weight:700;line-height:1.2;margin:0}
.wrap{max-width:680px;margin:0 auto;padding:16px}
.hud{position:sticky;top:env(safe-area-inset-top,0px);padding:8px 0 14px;z-index:5;background:linear-gradient(var(--bg) 80%,transparent)}
.path{display:flex;align-items:center}
.node{flex:0 0 auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--sf);border:3px solid var(--bd);font-size:21px;box-shadow:3px 3px 0 var(--sh);transform:rotate(-4deg)}
.node:nth-child(4n+3){transform:rotate(4deg)}
.node.on{background:var(--yel);animation:bob 1s ease-in-out infinite}
.node.done{background:var(--grn)}
.seg{flex:1;height:0;border-top:4px dashed var(--bd)}.seg.done{border-top-style:solid;border-color:var(--grn)}
.stats{display:flex;justify-content:space-between;margin-top:12px;font:700 16px "Fredoka",system-ui,sans-serif}
.chip{background:var(--sf);border:3px solid var(--bd);border-radius:999px;padding:3px 14px;box-shadow:3px 3px 0 var(--sh)}
.xp{color:var(--blue)}.combo{color:var(--pink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .xp{color:#8fb3ff}:root:not([data-theme="light"]) .combo{color:#ff8ab6}}
.card{background:var(--sf);border:4px solid var(--bd);border-radius:24px;padding:22px;margin-top:6px;box-shadow:8px 8px 0 var(--sh)}
.lv{display:inline-block;background:var(--vio);color:#fff;font:700 14px "Fredoka",system-ui,sans-serif;padding:3px 12px;border-radius:999px;border:2px solid var(--bd);margin-bottom:10px}
.q{font-size:22px;margin:10px 0 16px}
.mas{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.mi{font-size:46px;line-height:1;flex:0 0 auto;display:inline-block}
.mi.hop{animation:hop .5s}.mi.wig{animation:wig .5s}
.bub{position:relative;background:var(--yel);color:#111;border:3px solid var(--bd);border-radius:16px;padding:8px 14px;font-weight:700}
.bub::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:10px solid var(--bd);border-left:0}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:var(--fld);border:3px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:12px;cursor:pointer;box-shadow:4px 4px 0 var(--sh);transition:transform .1s,box-shadow .1s}
.opt:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--sh)}
.opt:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)}
.ltr{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font:700 18px "Fredoka",system-ui,sans-serif;border:3px solid var(--bd);background:var(--blue)}
.opt:nth-child(2) .ltr{background:var(--pink)}.opt:nth-child(3) .ltr{background:#0a9c6e}.opt:nth-child(4) .ltr{background:var(--vio)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,.chk:focus-within{outline:4px solid var(--blue);outline-offset:3px}
.opt:disabled{cursor:default}
.opt.p3{background:var(--ok);animation:hop .45s}.opt.p2{background:var(--mid)}.opt.p1,.opt.p0{background:var(--bad);animation:wig .45s}
.opt.dim{opacity:.5;box-shadow:none}
.fb{border:3px solid var(--bd);border-radius:16px;padding:14px 16px;margin:8px 0 16px;animation:pop .25s ease-out}
.fb.p3{background:var(--ok)}.fb.p2{background:var(--mid)}.fb.p1,.fb.p0{background:var(--bad)}
.fb b{font-family:"Fredoka",system-ui,sans-serif;font-size:19px}
.btn{font:700 18px "Fredoka",system-ui,sans-serif;background:var(--blue);color:#fff;border:3px solid var(--bd);border-radius:16px;padding:12px 24px;cursor:pointer;box-shadow:5px 5px 0 var(--sh);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--sh)}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--sh)}
.btn.alt{background:var(--yel);color:#111}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:3px solid var(--bd);background:var(--fld);color:var(--ink);margin:6px 0 16px}
label.l{font-weight:700;font-size:15px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:3px solid var(--bd);border-radius:16px;margin-bottom:12px;cursor:pointer;background:var(--fld);box-shadow:4px 4px 0 var(--sh)}
.chk input{width:24px;height:24px;margin-top:2px;accent-color:#0a9c6e;flex:0 0 auto}
.chk.on{background:var(--ok)}
.stars{font-size:40px;letter-spacing:4px}
.hero{font-size:54px;display:flex;gap:10px;margin-bottom:6px}
.hero span{animation:bob 1.4s ease-in-out infinite}.hero span:nth-child(2){animation-delay:.2s}.hero span:nth-child(3){animation-delay:.4s}
h1{font-size:34px;text-shadow:3px 3px 0 var(--pink)}
.big{font-size:70px;display:inline-block;animation:bob 1.2s ease-in-out infinite}
.bar{height:20px;background:var(--fld);border-radius:99px;overflow:hidden;border:3px solid var(--bd)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--grn) 0 10px,#0fa877 10px 20px);transition:width .9s}
.row{margin:14px 0}.row .t{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px;gap:8px}
.verdict{border:3px solid var(--bd);border-radius:18px;padding:16px;margin:14px 0;box-shadow:4px 4px 0 var(--sh)}
.mut{color:var(--mut)}
.mis{border:3px dashed var(--bd);border-radius:16px;padding:12px 14px;margin:14px 0;background:var(--fld)}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.snd{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:16px;border:3px solid var(--bd);background:var(--yel);font-size:24px;cursor:pointer;box-shadow:4px 4px 0 var(--sh);z-index:20}
.snd:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)}
.cf{position:fixed;top:-20px;width:10px;height:16px;border-radius:2px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes hop{0%{transform:scale(1)}40%{transform:scale(1.06) translateY(-6px)}100%{transform:scale(1)}}
@keyframes wig{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.node{width:38px;height:38px;font-size:18px;border-radius:12px}
@media (max-width:380px){.node{width:32px;height:32px;font-size:15px;border-radius:10px}}
.card+.card{margin-top:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.chip2{display:inline-block;background:var(--fld);border:3px solid var(--bd);border-radius:999px;padding:2px 12px;font:700 15px "Fredoka",system-ui,sans-serif;box-shadow:2px 2px 0 var(--sh)}
.gets{margin:6px 0 14px;padding-left:20px}.gets li{margin:6px 0}
.gh{font:700 18px "Fredoka",system-ui,sans-serif;margin:18px 0 8px}
.sh{font-size:24px;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 14px;font-size:15px}
.dc{border:3px solid var(--bd);border-radius:18px;padding:14px 16px;margin:16px 0;box-shadow:4px 4px 0 var(--sh);background:var(--fld)}
.dc.sK{background:var(--ok)}.dc.sT{background:var(--mid)}.dc.sV{background:var(--bad)}
.dh{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px 10px}
.dh .de{font-size:26px}.dh h3{font-size:21px}
.dh .badge{grid-column:1/-1;justify-self:start}
.badge{background:var(--sf);border:3px solid var(--bd);border-radius:999px;padding:1px 10px;font:700 13px "Fredoka",system-ui,sans-serif}
.ask{margin:6px 0 0;font-size:14px;color:var(--mut);font-style:italic}
.mt{margin:10px 0 4px}
.mr{display:grid;grid-template-columns:96px 1fr 42px;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:6px 0}
.mr .bar{height:14px}.mr b{text-align:right}
.dots{letter-spacing:6px;font-size:16px}
.mod{margin:8px 0 0;font-size:15px;font-weight:600}
.chkl{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:2px dashed var(--bd);font-size:15px}
.chkl li{margin:5px 0;display:flex;gap:8px;align-items:flex-start}
.bmc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.bb{border:3px solid var(--bd);border-radius:12px;padding:8px;font:700 13px/1.25 "Fredoka",system-ui,sans-serif;display:flex;flex-direction:column;gap:4px;min-height:66px;box-shadow:2px 2px 0 var(--sh)}
.bb.sK{background:var(--ok)}.bb.sT{background:var(--mid)}.bb.sV{background:var(--bad)}
.ac{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border:3px solid var(--bd);border-radius:16px;padding:12px 14px;margin:12px 0;background:var(--fld);box-shadow:4px 4px 0 var(--sh)}
.ac .w{background:var(--vio);color:#fff;border:2px solid var(--bd);border-radius:999px;padding:1px 10px;font:700 13px "Fredoka",system-ui,sans-serif}
textarea.ta{width:100%;min-height:200px;font:14px/1.5 system-ui,sans-serif;padding:12px;border:3px solid var(--bd);border-radius:14px;background:var(--fld);color:var(--ink);margin-top:10px}
.wrap{padding-bottom:84px}
@media (max-width:420px){.snd{width:44px;height:44px;font-size:20px;right:10px;border-radius:14px}}
</style>
</head>

<script>
const L=[
{n:"Temukan Masalah",e:"🔍",dm:0,intro:"Kasusmu: skill siswa SMK yang belum menghasilkan uang. Pastikan masalahnya benar-benar terjadi.",
q:[
{t:"Banyak temanmu jago desain dan edit video, tapi hampir tidak ada yang pernah dapat klien. Langkah pertama untuk memastikan ini masalah nyata?",o:[
["Langsung membuat website marketplace jasa siswa SMK.",0,"Itu melompat ke solusi. Pastikan dulu masalahnya nyata dan sering terjadi."],
["Mendata 15 temanmu yang punya skill: sudah pernah menawarkan jasa atau belum, dapat berapa klien, dan apa kendalanya.",3,"Tepat. Data dari kondisi nyata lebih kuat daripada perasaan."],
["Bertanya ke 2 teman dekat, 'susah ya cari klien?'",1,"Pertanyaannya menggiring. Teman dekat akan setuju supaya sopan."],
["Membaca artikel tentang tren freelancer muda di internet.",2,"Memberi konteks, tapi belum menunjukkan kondisi nyata di sekolahmu."]]},
{t:"Hasil pendataan: dari 15 siswa berskill, 12 belum pernah dapat klien berbayar dan 9 bilang tidak tahu cara mencari klien. Bagaimana merumuskan masalahnya?",o:[
["Anak SMK kurang percaya diri.",0,"Itu asumsi tentang sikap, belum ada bukti penyebabnya."],
["Siswa SMK punya skill desain dan konten, tapi sebagian besar belum pernah dapat klien berbayar karena tidak tahu cara menemukannya.",3,"Tepat. Jelas siapa yang terdampak, apa yang terjadi, dan ukurannya."],
["Skill siswa SMK belum bagus.",1,"Kamu belum mengujinya. Bisa jadi skillnya cukup, aksesnya yang kurang."],
["Siswa SMK sulit dapat klien.",2,"Mendekati, tapi belum ada angka dan penyebab yang jelas."]]},
{t:"Kamu menemukan tiga keluhan: tidak tahu cara cari klien, tidak tahu cara pasang harga, dan takut ditipu klien. Mana yang dikejar?",o:[
["Ketiganya sekaligus supaya dampaknya besar.",0,"Fokus terpecah. Tim kecil harus memilih satu."],
["Yang paling sering dan paling menghambat, dicek dengan data pendataan dan wawancara.",3,"Tepat. Prioritas berdasar frekuensi dan dampak."],
["Yang solusinya paling gampang dibuat.",1,"Mudah belum tentu penting. Bisa jadi kamu menyelesaikan masalah kecil."],
["Yang paling ramai dibahas di grup chat angkatan.",2,"Ramai bisa jadi sinyal, tapi belum tentu paling sering atau paling merugikan. Cek dengan data."]]}]},
{n:"Kenali Pelanggan",e:"🎯",dm:1,intro:"Siapa klien yang paling butuh dan mau membayar? Target yang tepat menentukan semua langkah berikutnya.",
q:[
{t:"Siapa target pelanggan berbayar pertamamu?",o:[
["Semua bisnis di kota.",0,"Terlalu luas. Kebutuhan tiap bisnis berbeda."],
["UMKM makanan dan minuman dalam radius 1 km dari sekolah yang aktif di Instagram atau TikTok tapi kontennya jarang diperbarui.",3,"Spesifik, mudah ditemui, dan perilakunya jelas."],
["Perusahaan besar supaya bayarannya besar.",1,"Sulit dijangkau dan belum tentu mau memakai jasa siswa pemula."],
["UMKM yang pemiliknya berusia di bawah 40 tahun.",2,"Lebih sempit, tapi usia tidak menunjukkan siapa yang benar-benar butuh konten."]]},
{t:"Siapa yang pertama kamu wawancarai?",o:[
["Orang tua temanmu yang punya usaha.",1,"Mudah dijangkau, tapi cenderung sungkan jujur."],
["Pemilik UMKM yang sudah pernah mencoba mengurus konten sendiri atau membayar orang untuk membuatnya.",3,"Tepat. Orang yang sudah berusaha mengatasi masalah adalah sinyal kuat."],
["Semua pengikut akun sekolah lewat polling story.",0,"Banyak jawaban tanpa seleksi menghasilkan data yang bising."],
["Guru bidang pemasaran digital.",2,"Bagus untuk memahami teori, tapi mereka bukan pemilik usaha yang merasakan masalahnya."]]},
{t:"Bisnismu punya sisi lain: teman-teman kreator yang akan mengerjakan pesanan. Apa yang kamu lakukan?",o:[
["Anggap saja mereka pasti mau ikut.",0,"Tanpa mereka tidak ada yang mengerjakan. Jangan berasumsi."],
["Wawancarai juga siswa kreator tentang waktu, kualitas kerja, dan kesiapan mereka terikat tenggat dari klien.",3,"Tepat. Bisnis dua sisi perlu memahami kedua pihak."],
["Tanya mereka, 'ideku bagus tidak?'",2,"Cukup, tapi itu meminta opini. Gali kemampuan dan kendalanya."],
["Tunggu sampai ada klien, baru bicara dengan mereka.",1,"Kamu bisa kehabisan tenaga kerja saat klien datang. Libatkan sejak awal."]]}]},
{n:"Validasi Masalah",e:"🧪",dm:0,intro:"Saatnya membuktikan masalah ini cukup kuat sampai orang mau mengeluarkan uang atau usaha.",
q:[
{t:"Pertanyaan wawancara mana yang paling kuat untuk pemilik UMKM?",o:[
["Kalau ada jasa konten dari siswa SMK, kamu mau pakai?",0,"Pertanyaan hipotetis. Jawaban sopan bukan fakta."],
["Ceritakan terakhir kali kamu butuh konten untuk promosi. Apa yang kamu lakukan dan berapa biayanya?",3,"Tepat. Cerita masa lalu mengungkap perilaku asli."],
["Menurutmu ideku keren tidak?",0,"Itu mengundang pujian. Pujian bukan data."],
["Seberapa sering kamu posting di media sosial dalam seminggu?",2,"Berguna untuk data kebiasaan, tapi belum menggali masalah dan cara mengatasinya."]]},
{t:"Dari 12 pemilik UMKM, 10 bilang 'konten itu penting, aku kewalahan'. Tapi hanya 2 yang pernah mengeluarkan uang untuk membuatnya. Kesimpulanmu?",o:[
["10 dari 12 setuju, masalah tervalidasi!",0,"Keluhan itu murah. Yang penting adalah uang dan usaha yang benar-benar keluar."],
["Keluhan banyak tapi yang mengeluarkan uang sedikit. Gali siapa 2 orang itu dan kenapa mereka mau membayar.",3,"Tepat. Kamu membaca perilaku, bukan kata-kata."],
["Tambah wawancara sampai angkanya bagus.",1,"Itu bias konfirmasi, mencari data yang menyenangkan."],
["Abaikan 2 orang itu, 10 lainnya sudah cukup.",0,"Justru 2 orang yang membayar itu sinyal paling berharga untuk digali."]]},
{t:"Temanmu bilang, 'Pasti laris, aku siap jadi tim!' tapi tidak mau ikut wawancara atau mencoba. Sikapmu?",o:[
["Anggap itu bukti dukungan yang kuat.",0,"Dukungan lisan itu murah. Bukti adalah tindakan."],
["Hargai, tapi catat sebagai opini. Cari bukti dari calon pelanggan yang mau bertindak.",3,"Tepat. Kamu memisahkan semangat dari bukti."],
["Abaikan dia sepenuhnya.",1,"Terlalu keras. Hargai dukungannya, tapi jangan jadikan data."],
["Ajak dia jadi kreator pertama dan lihat apakah dia benar-benar mengerjakan.",2,"Cara bagus menguji komitmen, tapi tetap cari bukti dari pelanggan sebenarnya, bukan hanya temanmu."]]}]},
{n:"Validasi Solusi",e:"🛠️",dm:2,intro:"Uji paket konten manual sebelum membangun platform apa pun. Apakah solusinya benar menjawab kebutuhan?",
q:[
{t:"Sebelum membuat platform, apa cara termurah menguji solusi jasa konten siswa?",o:[
["Membangun website marketplace lengkap dulu supaya meyakinkan.",0,"Mahal dan berisiko. Kamu belum tahu ada yang mau."],
["Menawarkan paket konten manual lewat WhatsApp ke UMKM, dikerjakan tim kecil siswa selama 2 minggu.",3,"Tepat. Murah, cepat, dan memberi sinyal komitmen nyata."],
["Membuat desain tampilan platform lalu menunjukkannya ke teman.",2,"Membantu visualisasi, tapi tanpa ajakan membeli kamu hanya dapat komentar."],
["Survei 100 UMKM tentang fitur platform yang diinginkan.",1,"Orang pandai menyebut fitur, tapi daftar keinginan tidak sama dengan kebutuhan."]]},
{t:"Penawaran paket dibuka: 30 UMKM bilang tertarik, tapi hanya 5 yang membayar. Cara membacanya?",o:[
["30 yang tertarik membuktikan minat besar.",0,"Tertarik itu gratis. Pembayaran adalah sinyal sebenarnya."],
["5 pembayar adalah sinyal nyata. Tanyakan alasan 5 pembayar dan 25 lainnya, lalu perbaiki.",3,"Tepat. Fokus pada komitmen dan belajar dari penolakan."],
["Gagal, ganti ide.",1,"Terlalu cepat menyerah. Lima pembayar adalah titik awal belajar."],
["Turunkan harga sampai semua yang tertarik mau membayar.",1,"Diskon menutupi sinyal. Cari tahu dulu apa yang membuat mereka enggan."]]},
{t:"Lima UMKM sudah membayar paket konten pertama. Seminggu kemudian hanya 1 yang memesan lagi. Yang lain bilang, 'Kontennya bagus kok.' Bagaimana kamu membacanya?",o:[
["Solusinya sudah tepat, karena semua pelanggan memuji hasilnya.",0,"Pujian bukan bukti solusi menjawab kebutuhan. Perilaku mereka justru berkata lain: 4 dari 5 tidak kembali."],
["Mewawancarai kelimanya: apa yang mereka harapkan, apa dampak konten untuk penjualan mereka, dan kenapa tidak lanjut. Solusi dianggap tepat kalau hasilnya terasa dan mereka mau mengulang.",3,"Tepat. Solusi menjawab kebutuhan kalau hasilnya terasa bagi pelanggan dan mereka kembali, bukan sekadar puas."],

 $("#go").onclick=()=>{st.qi=0;ques()};
}
function ques(){
 hud();toTop();st.ans=false;const l=L[st.lv],q=l.q[st.qi];
 M.innerHTML=`<div class="card"><div class="lv">${l.e} ${l.n} · Situasi ${st.qi+1} dari ${l.q.length}</div><div class="mas"><span class="mi" id="mi">🤖</span><span class="bub" id="mb">Pilih langkah terbaik ya!</span></div><h2 class="q">${esc(q.t)}</h2><div id="opts"></div><div id="fb"></div></div>`;
 const box=$("#opts");
 shuf(q.o).forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`<span class="ltr">${"ABCD"[i]}</span><span>${esc(o[0])}</span>`;b.onclick=()=>pick(b,o,q);box.appendChild(b)});

function pick(b,o,q){
 if(st.ans)return;st.ans=true;const p=o[1];
 document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x!==b)x.classList.add("dim")});

 const head=p===3?"Luar biasa! +"+gain+" XP":p===2?"Cukup baik. +"+gain+" XP":p===1?"Kurang tepat. +"+gain+" XP":"Jebakan! +0 XP";
 const last=st.qi===L[st.lv].q.length-1;
 $("#fb").innerHTML=`<div class="fb p${p}"><b>${head}</b><p style="margin:6px 0 0">${esc(o[2])}</p>${p<3?`<p style="margin:8px 0 0"><b style="font-size:15px">Langkah terbaik:</b> ${esc(best[0])}</p>`:""}</div><button class="btn" id="nx">${last?"Selesaikan Level":"Lanjut"}</button>`;

function lvDone(){

function result(n){
 toTop();
 const sk=[st.sc[0]+st.sc[2],st.sc[1],st.sc[3],st.sc[4],st.sc[5],st.sc[6]];

 const skAll=Math.round(st.sc.reduce((a,b)=>a+b,0)/63*100),evAll=Math.round(n/12*100),ready=Math.round(.4*skAll+.6*evAll);
 const kk=stt.filter(x=>x==="K").length,vv=stt.filter(x=>x==="V").length;
 let v,cls,msg;
 if(kk>=5&&vv===0){v="🚀 Siap Masuk Tahap Pengembangan";cls="ok";msg="Hampir semua aspek utamamu sudah punya bukti dan cara berpikir yang kuat. Fokus berikutnya: rapikan bukti, kembangkan prototype pada fitur inti, dan lengkapi BMC dengan angka nyata."}
 else if(vv>=3||(kk===0&&vv>=2)){v="🔴 Perlu Validasi Ulang Sebelum Mengembangkan";cls="bad";msg="Terlalu banyak aspek yang masih berupa dugaan. Mengembangkan prototype sekarang berisiko membuang waktu dan uang. Kerjakan next action di bawah dulu, mulai dari aspek yang paling awal."}
 else{v="🟡 Hampir Siap, Tutup Celah Dulu";cls="mid";msg="Fondasimu sudah ada, tapi beberapa aspek belum terbukti kuat. Tutup celah di bawah ini sebelum menambah fitur atau biaya."}
 let note="";
 if(skAll>=70&&evAll<60)note=`Cara berpikirmu kuat (${skAll}%), tapi bukti proyek baru ${n} dari 12. Kamu sudah tahu caranya, sekarang saatnya turun ke lapangan.`;
 else if(skAll<50&&evAll>=60)note=`Bukti yang kamu klaim cukup banyak (${n} dari 12), tapi skor latihan baru ${skAll}%. Minta mentor memeriksa kualitas buktimu, jangan sampai masih bias.`;
 const T=[[TH[0],"Calon Founder Pemula","🌱","Kamu baru melangkah, dan semua founder hebat pernah di titik ini."],[TH[1],"Pengamat Cermat","🔭","Kamu mulai peka melihat masalah, tinggal diasah dengan bukti."],[TH[2],"Detektif Pelanggan","🕵️","Kamu sudah paham cara menggali kebutuhan pelanggan."],[TH[3],"Penguji Handal","🧪","Kamu terbiasa menguji asumsi, bukan sekadar percaya."],[TH[4],"Founder Muda Tajam","🏅","Cara berpikirmu sudah setajam founder berpengalaman. Sekarang buktikan juga di proyek nyatamu."],[TH[5],"Legenda Startup Sekolah","👑","Nyaris sempurna. Cara berpikir dan bukti proyekmu berjalan beriringan."]];
 let ti=0;T.forEach((t,i)=>{if(st.xp>=t[0])ti=i});const tt=T[ti],nx=T[ti+1];
 const nm=st.name;
 const cards=D.map((d,i)=>{
  const s=stt[i];let mod="";
  if(skp[i]>=70&&ev[i]<2)mod=`Latihanmu di aspek ini sudah ${skp[i]}%, jadi hambatannya ada di eksekusi. Kerjakan ujinya di lapangan.`;
  else if(skp[i]<50&&ev[i]>=1)mod=`Skor latihanmu di aspek ini baru ${skp[i]}%. Periksa lagi cara kamu mengujinya bersama mentor supaya buktimu tidak bias.`;
  else if(skp[i]<50&&ev[i]===0)mod=`Aspek ini masih di tahap awal. Baca ulang penjelasan jawaban di level terkait, lalu mulai uji.`;
  const li=ITEMS.map((it,j)=>({it,j})).filter(o=>o.it.d===i).map(o=>`<li><span>${st.gate[o.j]?"✅":"⬜"}</span><span>${o.it.a}${st.gate[o.j]?"":" (belum tervalidasi)"}</span></li>`).join("");
  return `<div class="dc s${s}"><div class="dh"><span class="de">${d.e}</span><h3>${d.n}</h3><span class="badge">${SLE[s]} ${SLP[s]}</span></div>
  <p class="ask">${d.ask}</p>
  <div class="mt"><div class="mr"><span>Latihan</span><div class="bar"><i style="width:0" data-w="${skp[i]}%"></i></div><b>${skp[i]}%</b></div>
  <div class="mr"><span>Bukti proyek</span><span class="dots">${ev[i]>=1?"●":"○"}${ev[i]>=2?"●":"○"}</span><b>${ev[i]}/2</b></div></div>
  <p style="margin:8px 0 0">${d[s]}</p>${mod?`<p class="mod">${mod}</p>`:""}<ul class="chkl">${li}</ul></div>`}).join("");
 const bb=BM.map(([nm2,ds])=>({nm:nm2,w:ds.map(i=>stt[i]).sort((a,b)=>RK[b]-RK[a])[0]}));
 const weak=D.map((_,i)=>i).filter(i=>stt[i]!=="K").sort((a,b)=>RK[stt[b]]-RK[stt[a]]||a-b).slice(0,3);
 let arah;
 if(stt.slice(0,3).includes("V"))arah="Berhenti menambah fitur. Masalah, pelanggan, atau solusimu belum terbukti, jadi kembali ke lapangan dan validasi dulu sebelum prototype dikembangkan lagi.";
 else if(stt[3]!=="K"||stt[4]!=="K")arah="Perjelas value dan model bisnis lebih dulu. Prototype sebagus apa pun tetap sulit dijual kalau pelanggan belum paham untungnya dan angka bisnisnya belum jelas.";
 else if(stt[5]!=="K")arah="Rapikan prototype pada 3 fitur inti dan uji ke pengguna nyata dengan tugas nyata. Tunda semua fitur tambahan sampai hasil uji terbaca.";
 else arah="Arahmu sudah jelas: lanjutkan iterasi prototype pada fitur inti, perluas uji ke pengguna baru, dan pantau satu metrik sukses.";
 const acts=[];
 D.forEach((d,i)=>{ITEMS.forEach((it,j)=>{if(it.d===i&&!st.gate[j])acts.push({d:i,t:it.t})});
  if(stt[i]==="T"&&ev[i]===2)acts.push({d:i,t:`Minta mentor memeriksa buktimu di aspek ${d.n}. Skor latihanmu masih ${skp[i]}%, jadi pastikan buktinya tidak bias.`})});
 for(let k=0;acts.length<3&&k<EXTRA.length;k++)acts.push({d:-1,t:EXTRA[k]});
 const shown=acts.slice(0,5),more=acts.length-shown.length;
 const unv=ITEMS.filter((_,j)=>!st.gate[j]);
 const txt=[`FOUNDER QUEST${nm?" | "+nm:""}`,`Gelar: ${tt[1]} (${st.xp} XP) | Kesiapan: ${ready}%`,`Status: ${v.replace(/^\S+\s/,"")}`,"","FEEDBACK PER ASPEK",...D.map((d,i)=>`- ${d.n}: ${SLP[stt[i]]} (latihan ${skp[i]}%, bukti proyek ${ev[i]}/2)`),"","MASIH PERLU DIVALIDASI",...(unv.length?unv.map(it=>`- ${it.a}`):["- Semua aspek sudah punya bukti awal"]),"","BMC YANG PERLU DITINJAU",...(bb.filter(b=>b.w!=="K").length?bb.filter(b=>b.w!=="K").map(b=>`- ${b.nm}`):["- Tidak ada, rapikan dengan angka nyata"]),"","ARAH PRODUK",arah,"","NEXT ACTION",...shown.map((a,i)=>`${i+1}. [${WK[i]}] ${a.t}`)].join("\n");
 M.innerHTML=`<div class="card"><div class="lv">HASIL EKSPEDISI${nm?" · "+esc(nm):""}</div>
 <div class="big" style="font-size:60px">${tt[2]}</div>
 <h2 style="font-size:28px">${tt[1]}</h2>
 <p style="margin:6px 0">${tt[3]}</p>
 <p class="mut">Peringkat ${ti+1} dari 6 · ${st.xp} XP${nx?" · "+(nx[0]-st.xp)+" XP lagi menuju "+nx[1]:" · Peringkat tertinggi!"}<br>Kesiapan ${ready}% (latihan ${skAll}%, bukti proyek ${n} dari 12) · Kombo terbaik x${st.best}</p>
 <div class="verdict" style="background:var(--${cls})"><h3 style="font-size:21px;margin-bottom:6px">${v}</h3><p style="margin:0">${msg}</p></div>
 ${note?`<p class="mut" style="margin:10px 0">${note}</p>`:""}
 <div class="chips">${D.map((d,i)=>`<span class="chip2">${d.e} ${d.n} ${IC[stt[i]]}</span>`).join("")}</div>
 <p class="mut" style="font-size:14px;margin:0">🟢 kuat · 🟡 perlu dipertajam · 🔴 perlu validasi</p></div>
 <div class="card"><h2 class="sh">📋 Feedback per aspek</h2>
 <p class="sub">Latihan adalah cara berpikirmu di game. Bukti proyek adalah yang kamu centang di Gerbang Bukti. Status memadukan keduanya.</p>${cards}</div>
 <div class="card"><h2 class="sh">🗺️ Insight untuk BMC dan arah produk</h2>
 <p class="sub">Warna tiap kotak mengikuti hasil aspek yang terkait. Ini panduan awal. Isi BMC aslinya tetap dinilai bersama mentor.</p>
 <div class="bmc">${bb.map(b=>`<div class="bb s${b.w}"><span>${IC[b.w]}</span>${b.nm}</div>`).join("")}</div>
 ${weak.length?`<p style="margin:14px 0 6px"><b>Kotak yang perlu direvisi lebih dulu:</b></p><ul class="gets">${weak.map(i=>`<li><b>${D[i].n}</b> (${D[i].bmc}): ${D[i].bt}</li>`).join("")}</ul>`:`<p style="margin:14px 0 6px"><b>Semua aspek kuat.</b> Rapikan BMC dengan angka nyata dari ujimu.</p>`}
 <div class="mis"><b>🧭 Arah produk:</b> ${arah}</div></div>
 <div class="card"><h2 class="sh">✅ Next action</h2>
 <p class="sub">Urut dari yang paling mendasar, karena aspek di belakang bergantung pada aspek di depannya.</p>
 ${shown.map((a,i)=>`<div class="ac"><span class="w">${WK[i]}</span><div>${a.d>=0?`<b>${D[a.d].e} ${D[a.d].n}:</b> `:`<b>⭐ Penguat:</b> `}${a.t}</div></div>`).join("")}
 ${more>0?`<p class="mut" style="font-size:14px">Masih ada ${more} tugas lain di daftar validasi. Kerjakan setelah lima di atas selesai.</p>`:""}
 <p class="mut" style="font-size:14px">Catatan: asesmen ini mengukur cara berpikir dan bukti yang kamu laporkan sendiri. Hasilnya panduan refleksi untuk sesi mentoring, bukan penentu hasil seleksi.</p>
 <div class="acts"><button class="btn" id="re">Main Lagi</button><button class="btn alt" id="cp">Salin Ringkasan</button></div><p id="cm" class="mut" style="font-size:14px"></p><div id="ta"></div></div>`;
 if(cls==="ok"||ti>=4)confetti(100);
 requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll(".bar i").forEach(i=>i.style.width=i.dataset.w),60));
 $("#re").onclick=()=>{Object.assign(st,{lv:0,qi:0,xp:0,combo:0,best:0,sc:[0,0,0,0,0,0,0],gate:[],name:"",done:false,ans:false});intro()};
 const manual=()=>{$("#cm").textContent="Gagal menyalin otomatis. Teks di bawah bisa kamu salin manual.";$("#ta").innerHTML=`<textarea class="ta" readonly aria-label="Ringkasan hasil"></textarea>`;const t=document.querySelector("#ta textarea");t.value=txt;t.focus();t.select()};
 $("#cp").onclick=()=>{try{navigator.clipboard.writeText(txt).then(()=>{$("#cm").textContent="Ringkasan tersalin.";$("#ta").innerHTML=""},manual)}catch(e){manual()}};
}
const MD={3:["🤩","Mantap! Itu insting founder sejati!"],2:["😎","Lumayan! Dikit lagi sempurna."],1:["🤔","Hmm, masih ada yang lebih tajam nih."],0:["😵","Awas jebakan! Tenang, ini buat belajar."]};
function mood(p){const i=$("#mi"),b=$("#mb");if(!i)return;BGM.sfx(p);i.textContent=MD[p][0];b.textContent=MD[p][1];i.className="mi "+(p>=2?"hop":"wig");if(p===3)confetti(28)}
function confetti(n){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const c=["#ff4d8d","#ffe14d","#12c48b","#2d6cff","#8a4dff"];for(let i=0;i<n;i++){const e=document.createElement("i");e.className="cf";e.style.cssText=`left:${Math.random()*100}vw;background:${c[i%5]};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.4}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),3800)}}
const BGM={ctx:null,on:true,t:0,step:0,timer:null,
M:[[72,76,79,76,72,76,79,84],[69,72,76,72,69,72,76,81],[72,77,81,77,72,77,81,84],[71,74,79,74,71,74,79,83]],B:[48,45,41,43],
hz:m=>440*Math.pow(2,(m-69)/12),
start(){if(!this.on)return;if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();this.g=this.ctx.createGain();this.g.gain.value=.07;this.g.connect(this.ctx.destination)}
 if(this.ctx.state==="suspended")this.ctx.resume();if(!this.timer){this.t=this.ctx.currentTime+.05;this.timer=setInterval(()=>this.sched(),100)}},
stop(){clearInterval(this.timer);this.timer=null;if(this.ctx)this.ctx.suspend()},
note(m,t,d,ty,v){const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=ty;o.frequency.value=this.hz(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(this.g);o.start(t);o.stop(t+d+.05)},
sched(){const sp=60/132/2;while(this.t<this.ctx.currentTime+.3){const bar=Math.floor(this.step/8)%4,i=this.step%8;this.note(this.M[bar][i],this.t,sp*.9,"square",.5);if(i%4===0)this.note(this.B[bar],this.t,sp*3.2,"triangle",1.3);if(i%2===1)this.note(this.M[bar][i]-12,this.t,sp*.4,"triangle",.35);this.t+=sp;this.step++}},
sfx(p){if(!this.on||!this.ctx||this.ctx.state!=="running")return;const t=this.ctx.currentTime+.02;
 if(p===3){this.note(79,t,.12,"square",1.2);this.note(84,t+.1,.12,"square",1.2);this.note(91,t+.2,.25,"square",1.2)}
 else if(p===2)this.note(76,t,.2,"square",1.1);
 else{this.note(55,t,.15,"sawtooth",1);this.note(50,t+.14,.25,"sawtooth",1)}}};
(function(){const b=document.createElement("button");b.id="snd";b.className="snd";b.setAttribute("aria-label","Nyalakan atau matikan musik");b.textContent="🔊";document.body.appendChild(b);
 b.onclick=()=>{BGM.on=!BGM.on;b.textContent=BGM.on?"🔊":"🔇";BGM.on?BGM.start():BGM.stop()};
 document.addEventListener("visibilitychange",()=>{if(!BGM.ctx)return;document.hidden?BGM.ctx.suspend():BGM.on&&BGM.ctx.resume()})})();
intro();
